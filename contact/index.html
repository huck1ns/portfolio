<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Huckins | Contact Me!</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="../js/components.js" defer></script>
</head>
<body>
    <site-header></site-header>
    <section>
        <div class="section" id="contact-header">
            <div class = "heading-and-clock">
                <h1 class ="text">Contact Me!</h1>
                <div id="clock" class ="text"></div>

                <script>
                    function updateClock() {
                        const now = new Date();
                        document.getElementById('clock').textContent = now.toLocaleTimeString('en-Us', {
                            timeZone: 'America/New_York',
                            timeStyle: 'medium' 
                        }) + " in Boston";
                    }
                    updateClock(); 
                    setInterval(updateClock, 1000);
                </script>
            </div>
        </div>
        <div class = "section" id="contacts">
            <div class = "contact" id="email">
                <h2 class = "text">Best way to get in touch is by email:</h2>
                <a class = "text" href = "mailto:jackdhuckins@gmail.com">
                    <img src="../resources/email.svg" width= "24px">
                    <span>Send me a message!</span>
                </a>
            </div>
            <div class = "contact" id="socials">
                <h2 class = "text">Also reach out on socials:</h2>
                <ul class = "links">
                    <a class = "text" href = "https://linkedin.com/in/jackhuckins005">
                        <img src="../resources/linkedin.svg" width= "20px">
                        <span>LinkedIn</span>
                    </a>
                    <a class = "text" href = "https://github.com/huck1ns">
                        <img src="../resources/github.svg" width= "20px">
                        <span>GitHub</span>
                    </a>
                </ul>
            </div>
        </div>
    </section>
    <site-footer></site-footer>
</body>
</html>
